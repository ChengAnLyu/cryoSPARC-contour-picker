name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'packaging/**'
    paths:
      - '*.py'
      - 'tests/**'
      - 'assets/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.12 x64 for the build
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup 7.1.1'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          $expected = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup compiler download checksum mismatch.'
          }
          $process = Start-Process -FilePath $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$compiler`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $compiler 'ISCC.exe'))) {
            throw 'The Inno Setup compiler did not install successfully.'
          }
          "SARU_ISCC=$(Join-Path $compiler 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, install, verify, and uninstall the CPU edition
        shell: pwsh
        run: |
          ./packaging/build.ps1 -PythonExe (Get-Command python).Source -IsccPath $env:SARU_ISCC -TestInstaller
      - name: Upload the verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-Windows-CPU-${{ github.run_number }}
          path: |
            artifacts/SARU-Picker-Setup-*-win64.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-manifest.json
            artifacts/frozen-smoke-test.json
            artifacts/installed-smoke-test.json
            artifacts/icon-install-verification.json
            artifacts/capsid-profile-install-verification.json
            artifacts/installer-smoke.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Collect application logs into the workspace
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'SARU_Picker'
          if (Test-Path -LiteralPath $logs -PathType Container) {
            $destination = Join-Path $env:GITHUB_WORKSPACE 'build/diagnostics'
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Get-ChildItem -LiteralPath $logs -Filter '*.log' -File | Copy-Item -Destination $destination -Force
          }
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-Windows-diagnostics-${{ github.run_number }}
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/ui/*.png
            build/pyinstaller/**/warn-*.txt
            build/diagnostics/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
