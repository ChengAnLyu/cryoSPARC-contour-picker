name: Build SARU Picker 3.0.0 with four profiles for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'parallel/**'
    paths:
      - '*.py'
      - 'tests/**'
      - 'assets/**'
      - 'packaging/cryolo/**'
      - '.github/workflows/build-cryolo-windows.yml'

permissions:
  contents: read

concurrency:
  group: cryolo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install verified Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup 7.1.1'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Compiler checksum mismatch.' }
          $process = Start-Process -FilePath $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$compiler`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed.' }
          "SARU_CRYOLO_ISCC=$(Join-Path $compiler 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify four-profile offline app and installer
        shell: pwsh
        run: ./packaging/cryolo/build.ps1 -PythonExe (Get-Command python).Source -IsccPath $env:SARU_CRYOLO_ISCC -TestInstaller
      - name: Upload downloadable installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-Installer-3.0.0-${{ github.run_number }}
          path: |
            artifacts/cryolo/SARU-Picker-Setup-3.0.0-win64.exe
            artifacts/cryolo/download-manifest.json
            artifacts/cryolo/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload optional portable part 1
        if: ${{ hashFiles('artifacts/cryolo/portable-parts/portable.part01') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-Portable-3.0.0-${{ github.run_number }}-part01
          path: |
            artifacts/cryolo/portable-parts/portable.part01
            artifacts/cryolo/download-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload optional portable part 2
        if: ${{ hashFiles('artifacts/cryolo/portable-parts/portable.part02') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-Portable-3.0.0-${{ github.run_number }}-part02
          path: |
            artifacts/cryolo/portable-parts/portable.part02
            artifacts/cryolo/download-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload optional portable part 3
        if: ${{ hashFiles('artifacts/cryolo/portable-parts/portable.part03') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-Portable-3.0.0-${{ github.run_number }}-part03
          path: |
            artifacts/cryolo/portable-parts/portable.part03
            artifacts/cryolo/download-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload optional portable part 4
        if: ${{ hashFiles('artifacts/cryolo/portable-parts/portable.part04') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-Portable-3.0.0-${{ github.run_number }}-part04
          path: |
            artifacts/cryolo/portable-parts/portable.part04
            artifacts/cryolo/download-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve GUI build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARU-Picker-GUI-diagnostics-3.0.0-${{ github.run_number }}
          path: |
            artifacts/cryolo/**/*.json
            artifacts/cryolo/**/*.png
            artifacts/cryolo/*.log
            artifacts/cryolo/SHA256SUMS.txt
            build/cryolo/pyinstaller/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 14
