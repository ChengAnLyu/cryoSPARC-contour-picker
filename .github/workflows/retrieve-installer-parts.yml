name: Retrieve verified installer in parts

on:
  push:
    branches:
      - 'packaging/windows-installer-20261119'
    paths:
      - '.github/workflows/retrieve-installer-parts.yml'

permissions:
  contents: read
  actions: read

jobs:
  export-verified-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download authenticated original ZIP and create checked parts
        env:
          SARU_TRANSFER_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, urllib.request, urllib.error
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'ChengAnLyu/cryoSPARC-contour-picker'
          artifact_id = 14648795887
          expected_sha = '94dc41834d880e1fb7109a634100fe538db3397d67527c98b31645db95be258a'
          expected_bytes = 480744464
          api = f'https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}'
          headers = {'Authorization': 'Bearer ' + os.environ['SARU_TRANSFER_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=60) as response:
              metadata = json.load(response)
          assert metadata['workflow_run']['id'] == 44772457913
          assert metadata['workflow_run']['head_sha'] == '7da0c56a8dc871ddd824f2ab45f7c2a184ec8dda'
          assert metadata['digest'] == 'sha256:' + expected_sha and metadata['size_in_bytes'] == expected_bytes
          assert not metadata['expired']

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(api + '/zip', headers=headers), timeout=60)
              raise RuntimeError('Expected the authenticated artifact redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise RuntimeError(f'Artifact API status {error.code}') from None
              download_url = error.headers['Location']
          # Do not forward the GitHub token to the signed storage destination.
          source = Path('verified-source.zip')
          checksum, count = hashlib.sha256(), 0
          with urllib.request.urlopen(download_url, timeout=90) as response, source.open('wb') as destination:
              while block := response.read(1024 * 1024):
                  destination.write(block)
                  checksum.update(block)
                  count += len(block)
          assert count == expected_bytes and checksum.hexdigest() == expected_sha
          parts = []
          with source.open('rb') as stream:
              for index in range(1, 9):
                  data = stream.read(64 * 1024 * 1024)
                  assert data
                  directory = Path('parts') / f'part-{index:02d}'
                  directory.mkdir(parents=True)
                  name = f'archive.part-{index:02d}'
                  (directory / name).write_bytes(data)
                  parts.append({'index': index, 'name': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              assert not stream.read(1)
          manifest = {'source_artifact_id': artifact_id, 'source_run_id': 44772457913,
                      'source_commit': metadata['workflow_run']['head_sha'], 'original_archive_sha256': expected_sha,
                      'original_archive_bytes': expected_bytes, 'parts': parts,
                      'transfer_run_id': int(os.environ['GITHUB_RUN_ID'])}
          for part in parts:
              directory = Path('parts') / f"part-{part['index']:02d}"
              (directory / 'transfer-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              (directory / 'source-artifact.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps({'verified_original_bytes': count, 'verified_original_sha256': expected_sha, 'parts': len(parts)}))
          PYCODE
      - name: Upload verified part 01
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-01
          path: parts/part-01/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 02
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-02
          path: parts/part-02/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 03
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-03
          path: parts/part-03/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 04
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-04
          path: parts/part-04/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 05
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-05
          path: parts/part-05/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 06
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-06
          path: parts/part-06/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 07
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-07
          path: parts/part-07/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified part 08
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARU-Picker-2.7.0-transfer-part-08
          path: parts/part-08/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
